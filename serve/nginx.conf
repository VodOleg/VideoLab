server {
    listen 80;
    root /srv/site;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Rendered files; the listing (JSON) feeds index.html. Range requests work out of the box, so videos seek.
    location /videos/ {
        alias /srv/videos/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
